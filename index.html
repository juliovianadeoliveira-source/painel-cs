
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel CS</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:linear-gradient(135deg,#0f172a,#1e293b);
            color:#fff;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .box{
            text-align:center;
            background:#111827;
            padding:50px;
            border-radius:15px;
            box-shadow:0 0 30px rgba(0,0,0,.5);
            width:420px;
        }

        h1{
            margin-bottom:15px;
            color:#38bdf8;
        }

        p{
            color:#cbd5e1;
            margin-bottom:30px;
        }

        a{
            display:inline-block;
            padding:15px 35px;
            background:#38bdf8;
            color:#fff;
            text-decoration:none;
            border-radius:8px;
            font-weight:bold;
            transition:.3s;
        }

        a:hover{
            background:#0284c7;
            transform:scale(1.05);
        }
    </style>
</head>
<body>

<div class="box">
    <h1>Painel CS</h1>
    <p>Bem-vindo ao sistema.</p>

    <a href="painel3.0/">Entrar no Painel</a>
</div>

</body>
</html>
